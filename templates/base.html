<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Smart Home System{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid px-5">
    <a class="navbar-brand fw-bold text-uppercase" href="/">Smart Home</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="/">Home</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
            Nodes
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="{{ url_for('login') }}">NODE 1 (DHT22)</a></li>
            <li><a class="dropdown-item" href="{{ url_for('login') }}">NODE 2 (Ultrasonic)</a></li>
            <li><a class="dropdown-item" href="{{ url_for('login') }}">NODE 3 (PIR)</a></li>
            <li><a class="dropdown-item" href="{{ url_for('login') }}">NODE 4 (Camera)</a></li>
            <li><a class="dropdown-item" href="{{ url_for('login') }}">NODE 5 (LDR)</a></li>
          </ul>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('login') }}">Admin</a>
        </li>        <li class="nav-item">
          <a class="nav-link" href="/team">Team</a>
        </li>
       <li class="nav-item">
          <a class="nav-link" href="{{ url_for('about') }}">ABOUT</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- PAGE CONTENT -->
<main class="main-content">
  {% block content %}{% endblock %}
</main>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-4 mt-5">
  <div class="container-fluid">
    <p class="mb-0">&copy; 2026 Smart Home System. All rights reserved.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
