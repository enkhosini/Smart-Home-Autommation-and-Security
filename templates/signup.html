{% extends "base.html" %}

{% block title %}Signup{% endblock %}

{% block content %}

<body class="auth-page">
    <div class="container d-flex justify-content-center align-items-center"
        style="min-height: 100vh; margin-top: 70px;">

        <div class="card p-4 shadow rounded-0" style="width: 500px; height: 500px;">

            <form action="/signup" method="post">

                <div class="text-center mb-2">
                    <img src="{{ url_for('static', filename='images/house.webp') }}" alt="house icon"
                        style="width: 40px; height: 40px;">
                </div>

                <h1 class="text-center">Create an Account</h1>

                <div class="mb-3 mt-4">
                    <input type="email" name="email" class="form-control" placeholder="Email address" required>
                </div>

                <div class="mb-3">
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>

                <div class="mb-3">
                    <input type="password" class="form-control" placeholder="Re-enter password" required>
                </div>

                <div class="d-flex flex-column align-items-center mt-3">
                    <button type="submit" class="btn btn-primary" style="width: 370px;">
                        Sign up
                    </button>
                </div>

                <div class="text-center mt-4">
                    Already have an account?
                    <a href="{{ url_for('login') }}" style="text-decoration: none; color: rgb(27,155,198);">
                        Log in
                    </a>
                </div>

            </form>

        </div>

    </div>

    {% endblock %}
</body>
