{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<body class="auth-page">
  <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh; margin-top: 70px;">

    <form action="/login" method="post">

      <div class="card p-4 shadow rounded-0" style="width: 500px; height: 500px;">

        <h1 class="text-center">Please login</h1>
        <br>

        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text">
              <img src="static/images/email icon.png" alt="Email icon" style="width: 20px; height: 20px;">
            </span>
            <input type="email" name="email" class="form-control" placeholder="Please enter email">
          </div>
        </div>

        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text">
              <img src="static/images/icon_vector.png" alt="Password icon" style="width: 17px; height: 20px;">
            </span>
            <input type="password" name="password" class="form-control" placeholder="Please enter password">
          </div>
        </div>

        <div class="d-flex flex-column align-items-center">
          <button type="submit" class="btn btn-primary" style="width: 370px;">
            Login
          </button>
        </div>

        <br><br>

        <div class="d-flex justify-content-between">
          <a href="{{ url_for('signup') }}" class="btn btn-light"
            style="color: rgb(27, 155, 198); text-decoration: none;">
            Register
          </a>

          <button type="button" class="btn btn-light" style="color: rgb(27, 155, 198);">
            Forget Password?
          </button>
        </div>

      </div>
    </form>

  </div>

  {% endblock %}
</body>
